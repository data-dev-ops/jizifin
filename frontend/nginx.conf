server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static files
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security: block probe targets and dotfiles
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(env|php|git|sh|bak|sql|py|ini)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* ^/(proc|sys|etc)/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Static Vite build assets with aggressive caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing: fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
