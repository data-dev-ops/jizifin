name: CI & SonarQube Code Analysis

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-frontend:
    name: Frontend Vitest & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest with Coverage
        id: frontend_test
        continue-on-error: true
        run: |
          cd frontend
          npm run test:coverage

      - name: Upload Frontend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info

      - name: Create GitHub Issue on Frontend Test Failure
        if: steps.frontend_test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          TITLE="Frontend Test Failure on ${SHA:0:7}"
          BODY="## Frontend Vitest Suite Failed

          Frontend tests encountered failures on commit [\`${SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

          **Workflow Run:** $RUN_URL

          ---
          *This issue was opened automatically by the CI pipeline.*"

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues" \
            -d "$(jq -n \
                  --arg title "$TITLE" \
                  --arg body "$BODY" \
                  '{title: $title, body: $body, labels: ["bug", "frontend", "testing"]}')"

  test-backend:
    name: Backend Pytest & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv & dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          source $HOME/.local/bin/env || true
          export PATH="$HOME/.local/bin:$PATH"
          cd backend
          uv sync --dev

      - name: Run Pytest with Coverage
        id: backend_test
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd backend
          uv run pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Create GitHub Issue on Backend Test Failure
        if: steps.backend_test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          TITLE="Backend Test Failure on ${SHA:0:7}"
          BODY="## Backend Pytest Suite Failed

          Backend tests encountered failures on commit [\`${SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

          **Workflow Run:** $RUN_URL

          ---
          *This issue was opened automatically by the CI pipeline.*"

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues" \
            -d "$(jq -n \
                  --arg title "$TITLE" \
                  --arg body "$BODY" \
                  '{title: $title, body: $body, labels: ["bug", "backend", "testing"]}')"

  sonarqube:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Frontend Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Download Backend Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - name: Run SonarQube Scanner
        if: secrets.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.projectKey=finance_tracker
            -Dsonar.sources=backend/app,frontend/src
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
