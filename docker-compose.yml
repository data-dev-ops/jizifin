services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: jizifin-backend:latest
    container_name: finance-tracker-backend
    restart: unless-stopped
    environment:
      JIZIFIN_BIND: 0.0.0.0:8000
      JIZIFIN_DB_PATH: /data/finance.duckdb
      RUST_LOG: info
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "jizifin-api", "--healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      additional_contexts:
        backend: ./backend
    container_name: finance-tracker-frontend
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    container_name: finance-tracker-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    depends_on:
      - frontend
      - backend

  sonarqube:
    profiles:
      - full
    image: sonarqube:community
    container_name: finance-tracker-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - app-network

volumes:
  caddy_data:
  caddy_config:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  app-network:
    driver: bridge
