[project]
name = "finance-tracker-backend"
version = "0.1.0"
description = "Personal Finance Tracker — FastAPI/aiosqlite backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "apscheduler>=3.11.3",
    "cryptography>=42.0.5",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "anyio>=4.14.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
]

[tool.coverage.run]
relative_files = true
source = ["app"]

