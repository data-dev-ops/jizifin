[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
jizifin-domain = { path = "crates/jizifin-domain" }
jizifin-auditor = { path = "crates/jizifin-auditor" }
jizifin-store = { path = "crates/jizifin-store" }
duckdb = { version = "~1.20000.0", features = ["bundled", "parquet", "json", "r2d2", "chrono", "serde_json"] }
r2d2 = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
http-body-util = "0.1"

[workspace.lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
